name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run security and quality checks
        run: pre-commit run --all-files

      - name: Check for pii:allow exceptions
        run: |
          if grep -rn "pii:allow" --include='*.md' --include='*.yaml' --include='*.py' .; then
            echo "::warning::Found pii:allow exceptions — review these for legitimacy"
          fi
